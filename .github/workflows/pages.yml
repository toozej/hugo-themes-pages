name: Build and deploy theme demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Refresh private theme changes without giving them write access to this repo.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: theme-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Validate theme list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      themes: ${{ steps.themes.outputs.themes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate manifest and output build matrix
        id: themes
        run: python3 scripts/demos.py matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.theme.name }}
    needs: manifest
    # PR validation never receives credentials or executes private theme code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.manifest.outputs.themes) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check private repository credential
        env:
          THEME_KEY: ${{ secrets[matrix.theme.ssh_key_secret] }}
          SECRET_NAME: ${{ matrix.theme.ssh_key_secret }}
        run: |
          if [[ -z "$THEME_KEY" ]]; then
            echo "::error::Add the read-only theme deploy key as repository secret $SECRET_NAME. See README.md."
            exit 1
          fi
      - name: Check out private theme
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.theme.repository }}
          ref: ${{ matrix.theme.ref }}
          ssh-key: ${{ secrets[matrix.theme.ssh_key_secret] }}
          persist-credentials: false
          path: _themes/${{ matrix.theme.theme }}
      - name: Install pinned Hugo Extended from official release
        env:
          HUGO_VERSION: ${{ matrix.theme.hugo_version }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/hugo-bin"
          mkdir -p "$install_dir"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" -o "$install_dir/$archive"
          curl --fail --silent --show-error --location --retry 3 "$release/hugo_${HUGO_VERSION}_checksums.txt" -o "$install_dir/checksums.txt"
          cd "$install_dir"
          awk -v file="$archive" '$2 == file {print; found=1} END {if (!found) exit 1}' checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" hugo
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Build example site at its theme URL
        env:
          THEME_SLUG: ${{ matrix.theme.slug }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/demos.py build "$THEME_SLUG" --base-url "$PAGES_BASE_URL"
      - name: Upload rendered theme only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-${{ matrix.theme.slug }}
          path: _site/
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble Pages site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: theme-*
          path: _site
          merge-multiple: true
      - name: Generate demo index and check publication directory
        run: python3 scripts/demos.py index
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
